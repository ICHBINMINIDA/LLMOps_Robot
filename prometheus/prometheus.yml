global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gpu-exporter
    static_configs:
      # Exporter runs on the Windows host (start-exporter.ps1), because the Docker VM
      # cannot reach the server over VPN. For the container version use "gpu-exporter:9400".
      - targets: ["host.docker.internal:9400"]

  - job_name: pushgateway
    honor_labels: true          # keep the model label pushed by the benchmark
    static_configs:
      - targets: ["pushgateway:9091"]
